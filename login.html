<body class="bg-[#252525] text-zinc-300 antialiased min-h-screen flex flex-col justify-between pb-20">

  <nav class="bg-black border-b border-gray-800 px-4 py-3 shadow-lg sticky top-0 z-50 w-full">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">

      <div class="flex items-center gap-3 shrink-0">
        <div
          class="bg-purple-600 text-white w-10 h-10 rounded-lg flex items-center justify-center font-bold text-xl shadow-md overflow-hidden">
          <img src="img/logo-uaq.png" class="w-full h-full object-cover" alt="Logo UAQ">
        </div>
        <a href="index.html">
          <span class="text-white font-extrabold text-lg sm:text-xl tracking-wider uppercase">
            One<span class="text-purple-500">FIF</span>
          </span>
        </a>
      </div>

      <div class="flex-1 max-w-md relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
        </div>
        <input type="text" placeholder="Buscar..."
          class="w-full bg-gray-800 text-white placeholder-gray-400 text-sm rounded-full pl-10 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:bg-gray-700 transition-all duration-300 border border-transparent focus:border-transparent">
      </div>

    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center p-4 w-full">
    <div class="w-full max-w-sm bg-zinc-800 border border-zinc-700 rounded-2xl p-6 shadow-2xl relative overflow-hidden">

      <div class="absolute top-0 inset-x-0 h-1.5 bg-purple-600"></div>

      <div class="text-center mb-6 mt-2">
        <div
          class="w-12 h-12 bg-purple-600/10 text-purple-500 rounded-full flex items-center justify-center text-xl mx-auto mb-3 shadow-inner">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h1 class="text-xl font-black text-white uppercase tracking-wide">Acceso Alumnos</h1>
        <p class="text-xs text-zinc-400 mt-1">Ingresa a tu cuenta de OneFIF Mobile</p>
      </div>

      <form id="loginForm" class="space-y-5">

        <div class="flex flex-col gap-1.5">
          <label for="expediente" class="text-xs font-bold text-zinc-400 uppercase tracking-wider pl-1">
            Expediente UAQ
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fa-solid fa-id-card text-zinc-500 text-sm"></i>
            </div>
            <input type="text" id="expediente" name="expediente" required inputmode="numeric" pattern="[0-9]{6,7}"
              placeholder="Ej. 294856"
              class="w-full bg-zinc-900 border border-zinc-700 text-white placeholder-zinc-500 text-sm rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition-all duration-300">
          </div>
          <span class="text-[10px] text-zinc-500 pl-1">Solo dígitos numéricos de tu matrícula institucional.</span>
        </div>

        <button type="submit"
          class="w-full bg-purple-600 hover:bg-purple-700 text-white text-sm font-black uppercase tracking-wider py-3 rounded-xl shadow-lg transition-colors duration-300 transform active:scale-[0.98] flex items-center justify-center gap-2">
          <span>Ingresar</span>
          <i class="fa-solid fa-right-to-bracket text-xs"></i>
        </button>

      </form>

    </div>
  </main>

  <div class="sm:hidden fixed bottom-0 left-0 z-50 w-full h-16 bg-black border-t border-gray-800 shadow-2xl">
