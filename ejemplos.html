<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid de Divs</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 60%;
            margin: auto;
        }
        .container div {
            padding: 20px;
            text-align: center;
            font-size: 20px;
        }
        .container div:nth-child(odd) {
            background-color: brown;
            color: white;
        }
        .container div:nth-child(even) {
            background-color: beige;
            color: black;
        }
        .container div a {
            text-decoration: none;
            color: inherit;
        }
        .container div a:hover {
            background-color: green;
        }
        .container div a:active {
            color: red;
        }
        .container div a:visited {
            color: purple;
        }
    </style>
</head>
<body>
    <div class="container">
        <div><a href="https://www.xbox.com/es-MX/games/store/halo-wars-definitive-edition/BPRPQSKXTD1L">Halo Wars</a></div>
        <div><a href="https://www.xbox.com/es-MX/games/store/halo-reach/BTD24M1QCD56/0001">Halo Reach</a></div>
        <div><a href="https://www.xbox.com/es-MX/games/store/halo-combat-evolved-anniversary/C1XFHQSGWGD1/0001">Halo CE</a></div>
        <div><a href="https://www.xbox.com/es-MX/games/store/halo-2-anniversary/9P5739G419LD/0010">Halo 2</a></div>
        <div><a href="https://www.xbox.com/es-MX/games/store/halo-3-odst-edicion-campana/BWH5SB36X3VK/0001">Halo ODST</a></div>
        <div><a href="https://www.xbox.com/es-MX/games/store/halo-3/BSXZVK24CMR3/0001">Halo 3</a></div>
        <div><a href="https://www.xbox.com/es-MX/games/store/halo-4/9P8CFXZH93CK/0010">Halo 4</a></div>
        <div><a href="https://www.xbox.com/es-MX/games/store/halo-5-guardians/BRRC2BP0G9P0/0001">Halo 5</a></div>
        <div><a href="https://www.xbox.com/es-MX/games/store/halo-infinite-campana/9NP1P1WFS0LB/0010">Halo Infinite</a></div>
    </div>
</body>
</html>
